name: extended_nested_scroll_view
description: >-
  A drop-in replacement for Flutter's NestedScrollView that adds header
  stretch (SliverAppBar.stretch / FlexibleSpaceBar.stretchModes on overscroll)
  and keeps every tab list scrolling independently, alongside the pinned
  header and pull-to-refresh support of the original widget.
version: 0.1.0

environment:
  sdk: ^3.13.2
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sliver_tools: ^0.2.12

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter: