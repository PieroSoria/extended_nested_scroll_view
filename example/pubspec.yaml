name: extended_nested_scroll_view_example
description: >-
  Example app demonstrating the headerStretch behavior of the
  extended_nested_scroll_view package on a canonical profile screen.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.2
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  extended_nested_scroll_view:
    path: ../
  sliver_tools: ^0.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true